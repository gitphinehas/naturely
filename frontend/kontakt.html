    <div class="wrap page">
      <div class="panel narrow">
        <h1>Kontakt</h1>
        <p>Fragen oder Feedback? Schreib uns. (Formular noch ohne Funktion.)</p>
        <form data-static action="#" method="post">
          <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required autocomplete="name"></div>
          <div class="field"><label for="email">E-Mail</label><input id="email" name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label for="message">Nachricht</label><textarea id="message" name="message" rows="6" required></textarea></div>
          <button class="btn" type="submit">Nachricht senden</button>
          <p class="form-note" role="status"></p>
        </form>
        <p>Oder per E-Mail: <span class="placeholder">kontakt@example.org</span></p>
      </div>
    </div>
